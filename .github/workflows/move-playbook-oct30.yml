name: Move Playbook Oct30 to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Oct 30 export over index.html
        run: |
          set -e
          if [ -f playbook-export-oct30.html ]; then
            SRC=playbook-export-oct30.html
          elif [ -f riser-s-playbook.html ]; then
            SRC=riser-s-playbook.html
          else
            echo "No Oct 30 export file found"
            ls -la
            exit 1
          fi
          echo "Moving $SRC over index.html"
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git mv -f "$SRC" index.html
          git status --short
          git commit -m "Replace index.html with Oct 30 Playbook export"
          git push
