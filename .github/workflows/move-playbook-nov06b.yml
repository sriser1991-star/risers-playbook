name: Move Playbook Nov06b

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move exported file to index.html
        run: |
          mv -f riser-s-playbook.html index.html
          git add -A
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git commit -m "Move re-exported Playbook to index.html (Nov 6 second push)"
          git push
