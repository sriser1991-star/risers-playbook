name: Move Playbook to index.html (Nov 7 second push)

on:
  push:
    paths:
      - '.github/workflows/move-playbook-nov07b.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Move re-exported Playbook over index.html
        run: |
          mv -f riser-s-playbook.html index.html
          git add -A
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git commit -m "Move re-exported Playbook to index.html (Nov 7 second push)"
          git push
