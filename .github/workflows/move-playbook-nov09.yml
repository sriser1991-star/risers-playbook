name: Move playbook to index (Nov 9, 2026)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-playbook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Move playbook to index.html
        run: |
          mv -f riser-s-playbook.html index.html
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Move refreshed playbook to index.html (Nov 9, 2026)"
          git push
