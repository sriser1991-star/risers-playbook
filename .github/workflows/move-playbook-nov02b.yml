name: Move Playbook Nov 02b
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move export to index.html
        run: |
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git mv -f riser-s-playbook.html index.html
          git commit -m "Move Nov 2 second export to index.html (scan fix)"
          git push
