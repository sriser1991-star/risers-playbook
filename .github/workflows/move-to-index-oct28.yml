name: Move Oct 28 Playbook to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file over index.html
        run: |
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git mv -f riser-s-playbook.html index.html
          git commit -m "Replace index.html with Oct 28 Playbook export"
          git push
