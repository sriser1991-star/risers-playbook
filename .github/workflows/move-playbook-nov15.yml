name: Move playbook to index (Nov 15, 2026)
on:
  workflow_dispatch:
jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move playbook to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv riser-s-playbook.html index.html
          git add -A
          git commit -m "Move refreshed playbook to index.html (Nov 15, 2026)"
          git push
