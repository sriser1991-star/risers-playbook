name: Rename Playbook to index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename riser-s-playbook.html to index.html
        run: |
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git mv riser-s-playbook.html index.html
          git commit -m "Rename riser-s-playbook.html to index.html"
          git push
