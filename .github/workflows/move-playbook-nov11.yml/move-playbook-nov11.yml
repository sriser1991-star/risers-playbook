name: Move playbook to index (Nov 11, 2026)
on:
  push:
    paths:
      - riser-s-playbook.html
      - .github/workflows/move-playbook-nov11.yml
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move refreshed playbook to index.html
        run: |
          mv riser-s-playbook.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move refreshed playbook to index.html (Nov 11, 2026)" || echo "nothing to commit"
          git push



















