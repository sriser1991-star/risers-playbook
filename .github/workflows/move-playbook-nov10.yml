name: Move playbook to index (Nov 10, 2026)
on: push
jobs:
  move:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv -f riser-s-playbook.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move refreshed playbook to index.html (Nov 10, 2026)" || echo "nothing to commit"
          git push
