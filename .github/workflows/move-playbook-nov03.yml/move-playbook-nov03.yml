name: Move playbook to index (Nov 3)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file to index.html
        run: |
          mv riser-s-playbook.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm --cached riser-s-playbook.html || true
          git commit -m "Move refreshed playbook to index.html (Nov 3, 2026)" || echo "Nothing to commit"
          git push
