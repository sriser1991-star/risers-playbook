name: Move Playbook to index.html (Nov 18, 2026)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move refreshed playbook export to index.html
        run: |
          test -f riser-s-playbook.html
          mv riser-s-playbook.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html riser-s-playbook.html
          git commit -m "Move refreshed playbook to index.html (Nov 18, 2026)"
          git push
