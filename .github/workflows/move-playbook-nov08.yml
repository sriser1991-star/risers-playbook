name: Move Playbook to index.html

on:
  push:
    paths:
      - '.github/workflows/move-playbook-nov08.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move playbook export to index.html
        run: |
          mv -f riser-s-playbook.html index.html
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Move re-exported Playbook to index.html (Nov 8)" || echo "Nothing to commit"
          git push
