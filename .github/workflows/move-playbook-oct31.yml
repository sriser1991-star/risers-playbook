name: Move Playbook Oct31
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-playbook-oct31.yml
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded export to index.html
        run: |
          ls -la
          if [ -f riser-s-playbook.html ]; then
            git mv -f riser-s-playbook.html index.html
          elif [ -f risers-playbook.html ]; then
            git mv -f risers-playbook.html index.html
          elif [ -f riser-playbook.html ]; then
            git mv -f riser-playbook.html index.html
          else
            echo "No uploaded export file found" >&2
            exit 1
          fi
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git commit -m "Replace index.html with Oct 31 Playbook export"
          git push
