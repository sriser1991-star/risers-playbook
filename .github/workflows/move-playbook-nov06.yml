name: Move playbook to index (Nov 6, 2026)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move refreshed playbook to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv riser-s-playbook.html index.html
          git commit -m "Move refreshed playbook to index.html (Nov 6, 2026)"
          git push
