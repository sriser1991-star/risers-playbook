name: Move playbook to index (Nov 12, 2026)

on:
  push:
    branches: [main]
    paths:
      - riser-s-playbook.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move playbook to index.html
        run: |
          if [ ! -f riser-s-playbook.html ]; then
            echo "No riser-s-playbook.html found; nothing to do."
            exit 0
          fi
          mv riser-s-playbook.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move refreshed playbook to index.html (Nov 12, 2026)"
          git push
