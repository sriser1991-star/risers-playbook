name: Move Playbook to index.html (Nov 20, 2026)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-playbook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Move refreshed playbook to index.html
        run: |
          mv riser-s-playbook.html index.html
          git config user.name "sriser1991-star"
          git config user.email "sriser1991-star@users.noreply.github.com"
          git add index.html riser-s-playbook.html
          git commit -m "Move refreshed playbook to index.html (Nov 20, 2026)"
          git push
